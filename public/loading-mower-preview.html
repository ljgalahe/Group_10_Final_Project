<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loading mower preview — GreenScape</title>
    <style>
      :root {
        --green-800: #166534;
        --gs-green: #2f7a32;
        --gs-green-dark: #245c26;
        --stone-500: #78716c;
        --cream: #f7f4ef;
        /* Site greens from globals.css @theme (bg-green-*) */
        --grass-top: #6f7f5e;
        --grass-mid: #46523c;
        --grass-deep: #384232;
        --grass-bottom: #1a1f18;
        --walk: 7.5s;
        --stride: 0.65s;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: var(--cream);
        color: #052e16;
      }

      .screen {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(
            ellipse 70% 45% at 50% 18%,
            rgba(122, 138, 106, 0.12),
            transparent 60%
          ),
          var(--cream);
      }

      .eyebrow {
        position: absolute;
        top: 1.25rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        margin: 0;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--stone-500);
        text-align: center;
        white-space: nowrap;
      }

      .label {
        position: absolute;
        top: 32%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 4;
        margin: 0;
        font-size: clamp(1.05rem, 2.2vw, 1.35rem);
        color: var(--stone-500);
        text-align: center;
      }

      .label strong {
        color: var(--green-800);
        font-weight: 600;
      }

      .lawn {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: clamp(64px, 12vh, 96px);
        overflow: hidden;
        z-index: 1;
      }

      .lawn-grass {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          var(--grass-top) 0%,
          var(--grass-mid) 40%,
          var(--grass-deep) 72%,
          var(--grass-bottom) 100%
        );
      }

      .lawn-grass::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.4;
        background-image: repeating-linear-gradient(
          90deg,
          transparent 0 6px,
          color-mix(in srgb, #1a1f18 45%, transparent) 6px 8px,
          transparent 8px 14px,
          color-mix(in srgb, #58664a 50%, transparent) 14px 15px,
          transparent 15px 21px
        );
      }

      .crew-lane {
        position: absolute;
        left: 0;
        right: 0;
        bottom: clamp(4px, 1vh, 12px);
        height: clamp(240px, 46vh, 400px);
        pointer-events: none;
        z-index: 2;
        overflow: visible;
      }

      .crew {
        position: absolute;
        left: 0;
        bottom: 0;
        width: clamp(360px, 46vw, 540px);
        height: 100%;
        animation: walk-across var(--walk) linear infinite;
        will-change: transform;
        filter: drop-shadow(0 10px 14px rgba(26, 31, 24, 0.22));
      }

      @keyframes walk-across {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(110vw);
        }
      }

      .crew-art {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        animation: figure-bounce var(--stride) ease-in-out infinite;
      }

      @keyframes figure-bounce {
        0%,
        50%,
        100% {
          transform: translateY(0);
        }
        25%,
        75% {
          transform: translateY(-3.5px);
        }
      }

      .crew-art svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .leg-back,
      .leg-front {
        transform-box: fill-box;
        transform-origin: 50% 0%;
        animation-duration: var(--stride);
        animation-timing-function: cubic-bezier(0.4, 0.0, 0.2, 1);
        animation-iteration-count: infinite;
      }

      .leg-back {
        animation-name: stride-back;
      }

      .leg-front {
        animation-name: stride-front;
      }

      /* Contact → pass → plant → lift — opposing legs */
      @keyframes stride-back {
        0% {
          transform: rotate(18deg);
        }
        25% {
          transform: rotate(4deg);
        }
        50% {
          transform: rotate(-16deg);
        }
        75% {
          transform: rotate(6deg);
        }
        100% {
          transform: rotate(18deg);
        }
      }

      @keyframes stride-front {
        0% {
          transform: rotate(-16deg);
        }
        25% {
          transform: rotate(6deg);
        }
        50% {
          transform: rotate(18deg);
        }
        75% {
          transform: rotate(4deg);
        }
        100% {
          transform: rotate(-16deg);
        }
      }

      .torso {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: torso-sway var(--stride) ease-in-out infinite;
      }

      @keyframes torso-sway {
        0%,
        100% {
          transform: rotate(2deg) translateY(0);
        }
        25%,
        75% {
          transform: rotate(3deg) translateY(1px);
        }
        50% {
          transform: rotate(2deg) translateY(0);
        }
      }

      .head {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: head-nod var(--stride) ease-in-out infinite;
      }

      @keyframes head-nod {
        0%,
        50%,
        100% {
          transform: translateY(0);
        }
        25%,
        75% {
          transform: translateY(1.5px);
        }
      }

      .wheel {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: spin 0.55s linear infinite;
      }

      .wheel-r {
        animation-delay: -0.15s;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .note {
        position: absolute;
        left: 50%;
        top: 42%;
        transform: translateX(-50%);
        z-index: 5;
        width: min(540px, 90vw);
        margin: 0;
        padding: 0.75rem 1rem;
        border-radius: 12px;
        border: 1px dashed color-mix(in srgb, #c4c0b8 90%, #166534);
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(4px);
        font-size: 0.8rem;
        line-height: 1.45;
        color: var(--stone-500);
        text-align: left;
      }
    </style>
  </head>
